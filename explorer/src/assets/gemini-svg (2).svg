<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 683" width="100%" height="100%">
  <defs>
    <!-- Dark fabric gradient matching the rich black/indigo tone -->
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181824"/>
      <stop offset="35%" stop-color="#0f0f18"/>
      <stop offset="70%" stop-color="#1a1a28"/>
      <stop offset="100%" stop-color="#09090e"/>
    </linearGradient>

    <!-- Outer edge highlight along the primary curve -->
    <linearGradient id="primaryEdgeHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#404558" stop-opacity="0"/>
      <stop offset="70%" stop-color="#60677e" stop-opacity="0.4"/>
      <stop offset="95%" stop-color="#b0b9d2" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#e2e8f5" stop-opacity="1"/>
    </linearGradient>

    <!-- Highlight line defining the secondary parallel curve -->
    <linearGradient id="secondaryEdgeHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#303445" stop-opacity="0"/>
      <stop offset="60%" stop-color="#555c72" stop-opacity="0.3"/>
      <stop offset="90%" stop-color="#9aa3bc" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#cbd3e6" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Subtle inner fold depth shadow -->
    <radialGradient id="foldDepthShadow" cx="20%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .silhouette {
      fill: url(#bodyGradient);
    }
    .primary-curve {
      fill: none;
      stroke: url(#primaryEdgeHighlight);
      stroke-width: 4;
      stroke-linecap: round;
    }
    .secondary-curve {
      fill: none;
      stroke: url(#secondaryEdgeHighlight);
      stroke-width: 2.5;
      stroke-linecap: round;
    }
    .inner-fold {
      fill: none;
      stroke: #333748;
      stroke-width: 1.8;
      stroke-opacity: 0.6;
      stroke-linecap: round;
    }
    .soft-crease {
      fill: none;
      stroke: #252836;
      stroke-width: 1.5;
      stroke-opacity: 0.4;
      stroke-linecap: round;
    }
  </style>

  <!-- Main Silhouette Body Fill -->
  <path class="silhouette" d="
    M 0,0 
    L 200,0 
    C 230,40 260,75 300,110 
    C 350,150 420,205 465,270 
    C 510,335 515,420 495,490 
    C 475,560 440,610 420,683 
    L 0,683 
    Z
  "/>

  <!-- Fabric Depth Overlay -->
  <path fill="url(#foldDepthShadow)" d="
    M 0,180 
    C 40,200 80,240 120,250 
    C 70,300 30,350 0,380 
    Z
  "/>

  <!-- Left Side Front Profile Line / Waist Transition -->
  <path class="inner-fold" d="M 45,0 C 110,120 150,220 150,310 C 150,420 100,560 85,683" />

  <!-- Inner Crease / Fabric Folds on Left -->
  <path class="soft-crease" d="M 0,225 C 45,235 90,260 135,255" />
  <path class="soft-crease" d="M 0,310 C 35,300 75,290 110,270" />
  <path class="soft-crease" d="M 0,160 C 25,180 55,210 75,220" />

  <!-- Inner Accent Curve (lower Gluteal Crease Detail) -->
  <path class="inner-fold" d="M 305,565 C 380,565 440,520 470,430" />

  <!-- Secondary Inner Curve (Inner Contour Line) -->
  <path class="secondary-curve" d="
    M 180,0 
    C 210,38 240,70 280,105 
    C 330,145 398,198 440,262 
    C 482,326 486,405 468,472 
    C 450,538 418,588 370,683
  "/>

  <!-- Primary Outer Curve (Main Profile Edge Line) -->
  <path class="primary-curve" d="
    M 200,0 
    C 230,40 260,75 300,110 
    C 350,150 420,205 465,270 
    C 510,335 515,420 495,490 
    C 475,560 440,610 420,683
  "/>
</svg>
