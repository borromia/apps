<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 683" width="100%" height="100%">
  <defs>
    <!-- Sky / Atmospheric Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121118"/>
      <stop offset="40%" stop-color="#181822"/>
      <stop offset="70%" stop-color="#1c1f1a"/>
      <stop offset="100%" stop-color="#22201b"/>
    </linearGradient>

    <!-- Sunlight Radial Glow -->
    <radialGradient id="sunGlow" cx="78%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.3"/>
      <stop offset="35%" stop-color="#eab308" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#ca8a04" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Dark fabric gradient matching the rich black/indigo tone -->
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181824"/>
      <stop offset="35%" stop-color="#0f0f18"/>
      <stop offset="70%" stop-color="#1a1a28"/>
      <stop offset="100%" stop-color="#09090e"/>
    </linearGradient>

    <!-- Outer edge highlight along the primary curve (golden sunlight rim reflection) -->
    <linearGradient id="primaryEdgeHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#404558" stop-opacity="0"/>
      <stop offset="50%" stop-color="#786040" stop-opacity="0.3"/>
      <stop offset="85%" stop-color="#d4a373" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="1"/>
    </linearGradient>

    <!-- Highlight line defining the secondary parallel curve -->
    <linearGradient id="secondaryEdgeHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#303445" stop-opacity="0"/>
      <stop offset="60%" stop-color="#555c72" stop-opacity="0.3"/>
      <stop offset="90%" stop-color="#ca8a04" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Subtle inner fold depth shadow -->
    <radialGradient id="foldDepthShadow" cx="20%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. Background Fill -->
  <rect width="1024" height="683" fill="url(#bgGrad)"/>

  <!-- 2. Sun Glow Aura in background -->
  <rect width="1024" height="683" fill="url(#sunGlow)"/>

  <!-- 3. Silhouette Body Fill -->
  <path
    fill="url(#bodyGradient)"
    d="
      M 0,0 
      L 200,0 
      C 230,40 260,75 300,110 
      C 350,150 420,205 465,270 
      C 510,335 515,420 495,490 
      C 475,560 440,610 420,683 
      L 0,683 
      Z
    "
  />

  <!-- Fabric Depth Overlay -->
  <path
    fill="url(#foldDepthShadow)"
    d="
      M 0,180 
      C 40,200 80,240 120,250 
      C 70,300 30,350 0,380 
      Z
    "
  />

  <!-- Left Side Front Profile Line / Waist Transition -->
  <path
    d="M 45,0 C 110,120 150,220 150,310 C 150,420 100,560 85,683"
    fill="none"
    stroke="#333748"
    stroke-width="1.8"
    stroke-opacity="0.6"
    stroke-linecap="round"
  />

  <!-- Inner Crease / Fabric Folds on Left -->
  <path
    d="M 0,225 C 45,235 90,260 135,255"
    fill="none"
    stroke="#252836"
    stroke-width="1.5"
    stroke-opacity="0.4"
    stroke-linecap="round"
  />
  <path
    d="M 0,310 C 35,300 75,290 110,270"
    fill="none"
    stroke="#252836"
    stroke-width="1.5"
    stroke-opacity="0.4"
    stroke-linecap="round"
  />
  <path
    d="M 0,160 C 25,180 55,210 75,220"
    fill="none"
    stroke="#252836"
    stroke-width="1.5"
    stroke-opacity="0.4"
    stroke-linecap="round"
  />

  <!-- Inner Accent Curve (lower Gluteal Crease Detail) -->
  <path
    d="M 305,565 C 380,565 440,520 470,430"
    fill="none"
    stroke="#333748"
    stroke-width="1.8"
    stroke-opacity="0.6"
    stroke-linecap="round"
  />

  <!-- Secondary Inner Curve (Inner Contour Line) -->
  <path
    d="
      M 180,0 
      C 210,38 240,70 280,105 
      C 330,145 398,198 440,262 
      C 482,326 486,405 468,472 
      C 450,538 418,588 370,683
    "
    fill="none"
    stroke="url(#secondaryEdgeHighlight)"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <!-- Primary Outer Curve (Main Profile Edge Line) -->
  <path
    d="
      M 200,0 
      C 230,40 260,75 300,110 
      C 350,150 420,205 465,270 
      C 510,335 515,420 495,490 
      C 475,560 440,610 420,683
    "
    fill="none"
    stroke="url(#primaryEdgeHighlight)"
    stroke-width="3.5"
    stroke-linecap="round"
  />
</svg>
